<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="260" fill="#0E1B2B"/>

  <defs>
    <marker id="arrowA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF9900"/>
    </marker>
  </defs>

  <!-- Trigger -->
  <rect x="30" y="80" width="150" height="90" rx="10" fill="#232F3E" stroke="#4B90FF" stroke-width="2"/>
  <text x="105" y="115" fill="#FFFFFF" font-size="14" text-anchor="middle">Trigger</text>
  <text x="105" y="135" fill="#B0B8C1" font-size="12" text-anchor="middle">S3 / API Gateway</text>
  <text x="105" y="150" fill="#B0B8C1" font-size="12" text-anchor="middle">SQS / EventBridge</text>

  <line x1="180" y1="125" x2="255" y2="125" stroke="#FF9900" stroke-width="2" marker-end="url(#arrowA)"/>
  <text x="217" y="110" fill="#8A93A0" font-size="11" text-anchor="middle">gera</text>

  <!-- Event -->
  <rect x="255" y="90" width="130" height="70" rx="10" fill="#232F3E" stroke="#FF9900" stroke-width="2"/>
  <text x="320" y="120" fill="#FFFFFF" font-size="14" text-anchor="middle">event</text>
  <text x="320" y="138" fill="#B0B8C1" font-size="11" text-anchor="middle">JSON do trigger</text>

  <line x1="385" y1="125" x2="460" y2="125" stroke="#FF9900" stroke-width="2" marker-end="url(#arrowA)"/>

  <!-- Handler -->
  <rect x="460" y="60" width="180" height="130" rx="10" fill="#232F3E" stroke="#FF9900" stroke-width="3"/>
  <text x="550" y="95" fill="#FFFFFF" font-size="15" text-anchor="middle">handler(event, context)</text>
  <text x="550" y="118" fill="#B0B8C1" font-size="12" text-anchor="middle">lê o event</text>
  <text x="550" y="136" fill="#B0B8C1" font-size="12" text-anchor="middle">executa a lógica</text>
  <text x="550" y="154" fill="#B0B8C1" font-size="12" text-anchor="middle">consulta context (timeout, id)</text>

  <line x1="640" y1="125" x2="715" y2="125" stroke="#FF9900" stroke-width="2" marker-end="url(#arrowA)"/>

  <!-- Response -->
  <rect x="715" y="90" width="150" height="70" rx="10" fill="#232F3E" stroke="#4CAF50" stroke-width="2"/>
  <text x="790" y="118" fill="#FFFFFF" font-size="14" text-anchor="middle">return</text>
  <text x="790" y="136" fill="#B0B8C1" font-size="11" text-anchor="middle">resposta / status</text>

  <text x="450" y="225" fill="#8A93A0" font-size="13" text-anchor="middle">O handler é sempre o ponto de entrada: recebe o evento do trigger, processa e devolve uma resposta</text>
</svg>
