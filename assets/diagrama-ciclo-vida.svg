<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="280" fill="#0E1B2B"/>

  <defs>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF9900"/>
    </marker>
  </defs>

  <!-- INIT -->
  <circle cx="150" cy="130" r="70" fill="#232F3E" stroke="#4B90FF" stroke-width="3"/>
  <text x="150" y="120" fill="#FFFFFF" font-size="15" text-anchor="middle">INIT</text>
  <text x="150" y="140" fill="#B0B8C1" font-size="11" text-anchor="middle">"motor frio"</text>
  <text x="150" y="155" fill="#B0B8C1" font-size="11" text-anchor="middle">aloca máquina</text>

  <line x1="220" y1="130" x2="330" y2="130" stroke="#FF9900" stroke-width="2" marker-end="url(#arrowB)"/>

  <!-- INVOKE -->
  <circle cx="450" cy="130" r="70" fill="#232F3E" stroke="#FF9900" stroke-width="3"/>
  <text x="450" y="120" fill="#FFFFFF" font-size="15" text-anchor="middle">INVOKE</text>
  <text x="450" y="140" fill="#B0B8C1" font-size="11" text-anchor="middle">"motor ligado"</text>
  <text x="450" y="155" fill="#B0B8C1" font-size="11" text-anchor="middle">roda o handler</text>

  <!-- loop back for warm invocations -->
  <path d="M 450 60 C 450 20, 350 20, 330 60" stroke="#4CAF50" stroke-width="2" fill="none" marker-end="url(#arrowB)"/>
  <text x="390" y="35" fill="#4CAF50" font-size="10" text-anchor="middle">próxima chamada (ambiente quente)</text>

  <line x1="520" y1="130" x2="630" y2="130" stroke="#FF9900" stroke-width="2" marker-end="url(#arrowB)"/>

  <!-- SHUTDOWN -->
  <circle cx="750" cy="130" r="70" fill="#232F3E" stroke="#E05555" stroke-width="3"/>
  <text x="750" y="120" fill="#FFFFFF" font-size="15" text-anchor="middle">SHUTDOWN</text>
  <text x="750" y="140" fill="#B0B8C1" font-size="11" text-anchor="middle">"motor desliga"</text>
  <text x="750" y="155" fill="#B0B8C1" font-size="11" text-anchor="middle">libera recursos</text>

  <text x="450" y="245" fill="#8A93A0" font-size="13" text-anchor="middle">Sem chamadas por um tempo → volta pro Init na próxima invocação (cold start)</text>
</svg>
